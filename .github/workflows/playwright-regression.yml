name: Playwright Regression Tests

"on":
  workflow_dispatch:

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ORANGEHRM_BASE_URL: ${{ secrets.ORANGEHRM_BASE_URL }}
      ORANGEHRM_USERNAME: ${{ secrets.ORANGEHRM_USERNAME }}
      ORANGEHRM_PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run regression tests
        run: npx playwright test --grep "@regression" --project=chromium

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-regression-report
          path: playwright-report/
          retention-days: 30